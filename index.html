<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>gAIlery — Local Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">

    <div id="art-panel">
        <img id="art-image" src="" alt="Artwork">
        <button id="next-btn">Next Artwork</button>
    </div>

    <div id="chat-panel">
        <div id="chat-window"></div>

        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type your thoughts…">
            <button id="send-btn">Send</button>
        </div>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
